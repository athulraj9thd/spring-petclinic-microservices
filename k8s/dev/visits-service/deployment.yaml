apiVersion: apps/v1
kind: Deployment
metadata:
  name: visits-service
  namespace: petclinic-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visits-service
  template:
    metadata:
      labels:
        app: visits-service
    spec:
      containers:
        - name: visits-service
          image: athul9thd/spring-petclinic-visits-service:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "configserver:http://config-server:8888"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-server:8761/eureka"
          envFrom:
            - configMapRef:
                name: petclinic-config
